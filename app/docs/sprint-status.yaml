beta_foundations:
  supabase_auth:
    status: enabled_pending_first_jwt_smoke
    note: Email invite-only, premier compte et workspace, callback de choix du mot de passe, JWT asymmetric, memberships, RLS, login Flutter et stockage securise sont actives; le bearer POC reste la compatibilite de transition jusqu au premier smoke JWT.
  workspace_isolation:
    status: partial
    note: Auth et memberships sont multi-utilisateurs; sessions, contacts, transcripts et debriefs restent dans un snapshot mono-workspace.
  privacy_controls:
    status: backend_implemented
    note: Export portable, retention 90 jours et suppression des donnees workspace sont proteges par role; les operations destructives exigent une session Supabase. Automatisation, UI et suppression du compte Auth restent a livrer.
  coaching_quality:
    status: in_progress
    note: Audit, manifest, promotion gates et shadow harness sont livres; aucune carte ne devient live sans revue humaine et jeu annote.
  incoming_calls:
    status: native_foundation_disabled
    note: PushKit CallKit et FCM ConnectionService compilent mais les flags restent off sans credentials et validation sur appareils physiques.
  observability_ci:
    status: implemented_remote_run_blocked_by_github_billing
    note: Request IDs, logs structures sans contenu sensible et CI Android macOS iOS sont ajoutes; GitHub refuse actuellement d allouer un runner pour cause de facturation ou spending limit du compte.
  post_call_reliability:
    status: implemented_needs_production_restart_drill
    note: Les retries transitoires sont bornes, l etat du job est durable dans PostgreSQL et les jobs incomplets reprennent au bootstrap; la deduplication reste mono-processus.
  call_deep_links:
    status: implemented_needs_distribution_signing_validation
    note: Le schema pinkall ouvre le composeur pre-rempli a froid ou a chaud sans demarrer l appel; HTTPS est prepare sur iOS et Android, et devra etre revalide avec les signatures de distribution. macOS reste sur le schema personnalise tant que la signature est ad hoc.
  objection_learning:
    status: implemented_local_management_needs_durable_store
    note: Le debrief extrait des objections ancrees sur les segments prospect et les fusionne dans un document local expurge. Les reponses generees restent candidates; une reponse explicitement ajoutee par l utilisateur devient une instruction custom live et selectionnable par le coach. Le SaaS multi-instance devra remplacer le fichier local par PostgreSQL avec isolation workspace.

