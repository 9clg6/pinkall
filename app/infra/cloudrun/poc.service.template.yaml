# Cloud Run v1 declarative service template for the PostgreSQL snapshot POC.
# Replace every __PLACEHOLDER__ and deploy only through the project's approved
# prebuilt-image workflow. The image MUST remain pinned by digest.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: pinkall-api-poc
  labels:
    cloud.googleapis.com/location: europe-west9
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        # Completed business state is durable, but live media/event state is
        # still process-local. Keep one instance until live event fan-out and
        # the normalized SaaS store replace the snapshot POC.
        autoscaling.knative.dev/maxScale: "1"
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 20
      timeoutSeconds: 3600
      serviceAccountName: pinkall-api@__PROJECT_ID__.iam.gserviceaccount.com
      containers:
        - name: pinkall-api
          image: europe-west9-docker.pkg.dev/__PROJECT_ID__/pinkall/pinkall-api@sha256:__IMAGE_DIGEST__
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: supabase-ca
              mountPath: /etc/pinkall/certs
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 0
            timeoutSeconds: 2
            periodSeconds: 2
            failureThreshold: 30
          env:
            - name: STRICT_CONFIG
              value: "true"
            - name: PINKALL_ALLOW_EPHEMERAL_STORE
              value: "false"
            - name: PINKALL_STORAGE_TENANT_ID
              value: __PINKALL_STORAGE_TENANT_ID__
            - name: PUBLIC_BASE_URL
              value: __PUBLIC_BASE_URL__
            - name: DATABASE_SSL_ROOT_CERT
              value: /etc/pinkall/certs/supabase-ca.crt
            - name: STT_PROVIDER
              value: deepgram_flux
            - name: DEEPGRAM_REALTIME_BASE_URL
              value: wss://api.eu.deepgram.com
            - name: DEEPGRAM_FLUX_MODEL
              value: flux-general-multi
            - name: DEEPGRAM_LANGUAGE_HINT
              value: fr
            - name: DEEPGRAM_EOT_THRESHOLD
              value: "0.7"
            - name: DEEPGRAM_EAGER_EOT_THRESHOLD
              value: "0.45"
            - name: DEEPGRAM_EOT_TIMEOUT_MS
              value: "6000"
            - name: MISTRAL_REALTIME_MODEL
              value: voxtral-mini-transcribe-realtime-2602
            - name: MISTRAL_BATCH_MODEL
              value: voxtral-mini-2602
            - name: MISTRAL_TARGET_DELAY_MS
              value: "1000"
            - name: OPENAI_BASE_URL
              value: https://api.openai.com/v1
            - name: OPENAI_COACH_MODEL
              value: gpt-5.4-mini
            - name: OPENAI_POST_CALL_MODEL
              value: gpt-5.4-mini
            - name: OPENAI_COACH_REASONING_EFFORT
              value: none
            - name: OPENAI_POST_CALL_REASONING_EFFORT
              value: low
            - name: COACH_MODE_DEFAULT
              value: "off"
            - name: COACH_PROVIDER
              value: openai
            - name: POST_CALL_PROVIDER
              value: openai
            - name: COACH_RELEASE_CHANNEL
              value: internal_alpha
            - name: COACH_MIN_CONFIDENCE
              value: "0.75"
            - name: COACH_MIN_INTERVAL_MS
              value: "8000"
            - name: MAX_SESSION_AUDIO_BYTES
              value: "67108864"
            - name: TELNYX_API_BASE_URL
              value: https://api.telnyx.com/v2
            - name: TELNYX_TELEPHONY_CREDENTIAL_ID
              value: __TELNYX_TELEPHONY_CREDENTIAL_ID__
            - name: TELNYX_PUBLIC_KEY
              value: __TELNYX_ED25519_PUBLIC_KEY__
            - name: TELNYX_WEBRTC_CONNECTION_ID
              value: __TELNYX_WEBRTC_CONNECTION_ID__
            - name: TELNYX_CALL_CONTROL_CONNECTION_ID
              value: __TELNYX_CALL_CONTROL_CONNECTION_ID__
            - name: TELNYX_FROM_NUMBER
              value: __TELNYX_FROM_NUMBER_E164__
            - name: TELNYX_CALLER_NAME
              value: __TELNYX_CALLER_NAME__
            - name: TELNYX_CALLER_NUMBER
              value: __TELNYX_CALLER_NUMBER_E164__
            - name: PINKALL_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: pinkall-api-token
                  key: "1"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: pinkall-database-url
                  key: "1"
            - name: TELNYX_API_KEY
              valueFrom:
                secretKeyRef:
                  name: pinkall-telnyx-api-key
                  key: "1"
            - name: MISTRAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: pinkall-mistral-api-key
                  key: "1"
            - name: DEEPGRAM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: pinkall-deepgram-api-key
                  key: "1"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: pinkall-openai-api-key
                  key: "1"
      volumes:
        - name: supabase-ca
          secret:
            secretName: pinkall-supabase-ca
            items:
              - key: "1"
                path: supabase-ca.crt
